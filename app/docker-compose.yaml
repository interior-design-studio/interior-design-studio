services:
  studio:
    build:
      context: ..
      dockerfile: app/backend/Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./:/app
      - my_media:/app/media
    env_file:
      - .env
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db
    working_dir: /app/backend

  db:
    image: postgres:16.0-alpine3.17
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - my_db:$PGDATA

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  celery:
    build:
      context: ..
      dockerfile: app/backend/Dockerfile
    command: >
      sh -c "python manage.py wait_for_db &&
             celery -A design_studio worker -l INFO"
    depends_on:
      - redis
      - db
    env_file:
      - .env
    volumes:
      - ./:/app
      - my_media:/app/media
    working_dir: /app/backend

volumes:
  my_db:
  my_media:
